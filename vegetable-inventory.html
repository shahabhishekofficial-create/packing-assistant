<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><title>Vegetable Inventory — In-Hand Count</title><link rel="stylesheet" href="styles.css?v=veg-1"><link rel="stylesheet" href="vegetable-inventory.css?v=veg-1"></head><body class="vegetableCountPage"><main id="vegApp"><header class="vegTopbar"><div><strong>Vegetable Inventory</strong><span>In-hand counting</span></div><div class="vegTopActions"><div class="vegLang" role="group"><button data-lang="en" class="active">English</button><button data-lang="hi">हिन्दी</button><button data-lang="gu">ગુજરાતી</button></div><button id="vegLogout" class="vegLogout">↪</button></div></header><section id="vegLogin" class="vegLogin"><div class="vegLoginCard"><span class="vegKicker">WAREHOUSE STAFF</span><h1 data-t="title">Vegetable stock count</h1><p data-t="loginHelp">Sign in with your staff name and PIN.</p><label>Staff name<input id="vegStaffName" autocomplete="username"></label><label>PIN<input id="vegStaffPin" type="password" inputmode="numeric" maxlength="6"></label><button id="vegLoginBtn" class="vegPrimary" data-t="signIn">Sign In</button><p id="vegLoginMsg" class="vegMsg"></p></div></section><section id="vegWorkspace" class="vegHidden"><div class="vegWelcome"><div><span class="vegKicker">TODAY'S COUNT</span><h1 id="vegStaffTitle"></h1><p id="vegDateLabel"></p></div><span id="vegSessionBadge" class="vegBadge">Not started</span></div><div class="vegCard vegPicker"><div class="vegCardTitle"><b data-t="selectItem">1. Select vegetable</b><small data-t="searchHelp">Search by name or spelling.</small></div><input id="vegSearch" class="vegSearch" placeholder="Search vegetable"><div id="vegItems" class="vegItemList"></div></div><div id="vegEntry" class="vegCard vegHidden"><div class="vegSelected" id="vegSelected"></div><div class="vegCardTitle"><b data-t="grade">2. Select grade</b></div><div class="vegGrades"><button data-grade="A">A Grade</button><button data-grade="B">B Grade</button><button data-grade="DUMP">Dump</button></div><div id="vegDetails" class="vegDetails vegHidden"><label><span data-t="weight">Weight (kg)</span><input id="vegWeight" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0.000"></label><label id="vegInwardWrap" class="vegHidden"><span data-t="inward">Inward date</span><input id="vegInwardDate" type="date"></label><label id="vegReasonWrap" class="vegHidden"><span data-t="reason">Reason (optional)</span><textarea id="vegReason" rows="3" placeholder="Optional reason"></textarea></label><button id="vegSaveBtn" class="vegPrimary" data-t="saveNext">Save &amp; Next</button><p id="vegSaveMsg" class="vegMsg"></p></div></div><div class="vegFinish"><button id="vegFinishBtn" class="vegSecondary" data-t="finish">Finish Today's Count</button><p id="vegFinishMsg" class="vegMsg"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=veg-1"></script><script src="vegetable-inventory.js?v=veg-1"></script></body></html>
