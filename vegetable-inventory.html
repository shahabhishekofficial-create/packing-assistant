<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><title>Vegetable Inventory — In-Hand Count</title><link rel="stylesheet" href="styles.css?v=20261004-nologin5"><link rel="stylesheet" href="vegetable-inventory.css?v=20261004-nologin5"></head><body class="vegetableCountPage"><main id="vegApp"><header class="vegTopbar"><div><strong>Vegetable Inventory</strong><span>In-hand counting</span></div><div class="vegTopActions"><div class="vegLang" role="group"><button data-lang="en" class="active">English</button><button data-lang="hi">हिन्दी</button><button data-lang="gu">ગુજરાતી</button></div><button type="button" aria-label="Inventory menu"></button></div></header><div id="vegStartupError" class="vegStartupError vegHidden" role="alert"></div><section id="vegWorkspace" class="vegHidden"><div class="vegWelcome"><div><span class="vegKicker">TODAY'S COUNT</span><h1 id="vegStaffTitle"></h1><p id="vegDateLabel"></p></div><div class="vegStatus"><span id="vegSessionBadge" class="vegBadge">Session open</span><b id="vegCountedBadge">0 saved</b></div></div><section class="vegQuickCard"><div class="vegQuickHead"><div><b data-t="quickCount">Quick count</b><small data-t="quickHelp">Search → choose → enter kg → save.</small></div><span class="vegShortcut">Enter ↵</span></div><input id="vegSearch" class="vegSearch" placeholder="Search vegetable…" autocomplete="off" enterkeyhint="search"><div id="vegItems" class="vegItemList"></div></section><section id="vegEntry" class="vegQuickEntry vegHidden"><div class="vegEntryHead"><div id="vegSelected"></div><button id="vegClearBtn" class="vegClear" type="button">×</button></div><div class="vegGradeRow"><button data-grade="A">A <span>Grade</span></button><button data-grade="B">B <span>Grade</span></button><button data-grade="DUMP">Dump</button></div><div class="vegQtyRow"><label for="vegWeight" data-t="weight">Weight (kg)</label><input id="vegWeight" type="number" min="0" step="0.001" inputmode="decimal" placeholder="0.000" enterkeyhint="done"><span>kg</span></div><label id="vegReasonWrap" class="vegReason vegHidden"><span data-t="reason">Reason (optional)</span><textarea id="vegReason" rows="2" placeholder="Optional reason"></textarea></label><button id="vegSaveBtn" class="vegSave" data-t="save">Save Count</button><p id="vegSaveMsg" class="vegMsg"></p></section><section class="vegRecent"><div class="vegRecentHead"><b data-t="recent">Recently saved</b><small data-t="recentHelp">Your latest entries</small></div><div id="vegRecentList" class="vegRecentList"><span class="vegEmpty">No counts saved yet.</span></div></section><div class="vegSubmittedActions vegHidden" id="vegSubmittedActions"><div class="vegSubmittedOk"><b data-t="submitted">Count submitted</b><span data-t="submittedHelp">Your record is ready to download or share.</span></div><div class="vegReportButtons"><button id="vegPdfBtn" class="vegPrimary" data-t="downloadPdf">Download PDF</button><button id="vegShareBtn" class="vegSecondary vegHidden" data-t="sharePdf">Share PDF</button></div></div><div class="vegFinish"><button id="vegFinishBtn" class="vegSecondary" data-t="finish">Finish Today's Count</button><p id="vegFinishMsg" class="vegMsg"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="config.js?v=20261004-nologin5"></script><script src="vegetable-inventory.js?v=20261004-nologin5"></script><script>window.PA_VERSION_URL="version.json";</script><script src="update.js?v=20261004-nologin5"></script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=20261004-nologin5",{updateViaCache:"none"}).then(r=>r.update()).catch(console.warn));}</script></body></html>
