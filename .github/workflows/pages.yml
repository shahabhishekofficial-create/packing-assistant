name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check driver/driver.js
          node --check admin/auth.js
          node --check admin/team.js
          node --check admin/inventory.js
          node --check admin/inventory-nav.js
          node --check admin/vegetable-inventory.js
          node --check inventory-count.js
          node --check vegetable-inventory.js
          node --check config.js
          node --check update.js
          node --check driver/sw.js
          node --check admin/sw.js
          node --check sw.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate driver API
        run: deno check --quiet supabase/functions/driver-api/index.ts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
