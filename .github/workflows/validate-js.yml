name: Validate JavaScript

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate all source files
        run: bash scripts/validate-source.sh
      - name: Check service workers
        run: |
          node --check driver/sw.js
          node --check admin/sw.js
          node --check sw.js
