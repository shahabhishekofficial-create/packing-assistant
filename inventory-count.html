<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fb"><title>Warehouse Inventory Count</title><link rel="stylesheet" href="styles.css?v=20260925-24"></head><body class="packerPage"><main id="inventoryApp"><header class="appHeader"><div class="brand"><div class="brandIcon">📦</div><div><h1>Warehouse Inventory</h1><p>Count stock quickly and accurately</p></div></div></header><section id="login" class="screen"><div class="adminCard"><span class="eyebrow">STAFF LOGIN</span><h2>Warehouse Count</h2><label>Staff name<input id="staffName" autocomplete="username"></label><label>PIN<input id="staffPin" type="password" inputmode="numeric" maxlength="6"></label><button id="loginBtn" class="primary">Sign In</button><p id="loginMsg" class="hint"></p></div></section><section id="count" class="screen hidden"><div class="sectionHead"><div><span class="eyebrow">WAREHOUSE COUNT</span><h2 id="staffTitle"></h2></div><button id="logoutBtn" class="secondary">Logout</button></div><div class="adminCard"><label>Inventory section<select id="section"><option value="restaurant">Restaurant Grocery</option><option value="vegetable">Vegetables</option></select></label><button id="startBtn" class="primary">Start Count</button><p id="sessionMsg" class="hint"></p></div><div id="counter" class="adminCard hidden"><input id="search" placeholder="Search item or barcode"><div id="itemInfo" class="hint">Select an item.</div><label>Count quantity<input id="countQty" type="number" min="0" step="any" inputmode="decimal"></label><div id="conversion" class="hint"></div><button id="saveBtn" class="primary">Save Count</button><button id="nextBtn" class="secondary">Next Item</button><div id="savedMsg" class="hint"></div></div><div id="items" class="adminCard hidden"></div><button id="submitBtn" class="good hidden">Submit Count</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260925-24"></script><script src="inventory-count.js?v=20260925-24"></script></body></html>
